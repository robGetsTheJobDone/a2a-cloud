[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-e2e"
version = "0.1.0"
description = "End-to-end black-box tests for the a2a platform API"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["e2e"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: end-to-end flows that can take 1+ minutes (chart render)",
]
