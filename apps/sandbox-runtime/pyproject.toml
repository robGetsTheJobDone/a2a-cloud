[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox-runtime"
version = "0.1.0"
description = "Host-side microsandbox runtime: FUSE-mounted MinIO ↔ microsandbox VM"
requires-python = ">=3.11"
dependencies = [
  "a2a-pack>=0.1.75",
  "microsandbox==0.3.14",
  "fusepy>=3.0",
]

[project.scripts]
sandbox-runtime = "sandbox_runtime.service:run"

[project.optional-dependencies]
# Pulled when running this package as a standalone HTTP service.
service = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
]
# Pulled when using MinIO as the FUSE backend.
minio = [
  "boto3>=1.34",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["sandbox_runtime"]
