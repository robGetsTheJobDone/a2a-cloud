[project]
name = "a2a-code-editor-agent"
version = "0.2.8"
description = "OpenHarness + CodeGraph A2A code editor agent"
requires-python = ">=3.11"
dependencies = [
  "a2a-pack>=0.1.82",
  "httpx>=0.27",
  "openharness-ai>=0.1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code_editor_agent*"]
