[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-control-plane"
version = "0.1.0"
description = "Control plane API: auth, agent registration, deploy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic[email]>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "bcrypt>=4.1",
  "PyJWT>=2.8",
  "kubernetes>=29.0",
  "PyYAML>=6",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.23",
  "httpx>=0.27",
  "boto3>=1.34",
  "redis>=5.0",
  "dnspython>=2.6",
  "cryptography>=42",
  "qdrant-client>=1.14",
  "fastembed>=0.6",
  # Generated meta-agents rely on SDK memory and composition safety facades.
  # >=0.1.101 required: generated OpenAPI-agent source uses @skill(input_schema=...).
  "a2a-pack",  # resolved from ../sdk/a2a-pack via [tool.uv.sources]
  # Production orchestrator (apps/control-plane/main_agent/) needs these to
  # build the LangGraph deepagents graph used by /v1/me/chat.
  "deepagents>=0.5.0",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.6",
  # Postgres-backed checkpointer so chat threads survive restarts.
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "aiosqlite>=0.20"]

[project.scripts]
a2a-control-plane = "control_plane.main:run"
a2a-e2e-user-token = "control_plane.e2e_users:main"

[tool.hatch.build.targets.wheel]
packages = ["control_plane", "main_agent"]
artifacts = [
  "control_plane/company_brain/*.json",
  "control_plane/data/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
a2a-pack = { path = "../sdk/a2a-pack", editable = true }
