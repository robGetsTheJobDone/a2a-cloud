name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK (a2a-pack)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/a2a-pack } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest -q
      - name: Docs are generated from source
        run: uv run python ../../web/apps/docs/scripts/check.py --repo-root ../..

  sdk-typescript:
    name: SDK (a2a-pack-ts)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/a2a-pack/typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sdk/a2a-pack/typescript/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: ../scripts/sync-ts-sidecar.sh --check

  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: control-plane } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest -q

  web:
    name: Web workspace
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
