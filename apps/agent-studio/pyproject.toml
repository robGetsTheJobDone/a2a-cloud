[project]
name = "a2a-agent-studio"
version = "0.1.17"
description = "A2A Agent Studio build-review-improve coordinator"
requires-python = ">=3.11"
dependencies = [
  "a2a-pack>=0.1.104",
  "playwright>=1.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_studio*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["../a2a"]
