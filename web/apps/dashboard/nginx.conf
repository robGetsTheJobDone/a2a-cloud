server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_static on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml
    text/css
    text/javascript
    text/plain;

  # Proxy /v1/* to the in-cluster control plane so the SPA can use
  # same-origin relative URLs (no CORS dance). The control-plane service is a
  # Knative ExternalName, so keep DNS fresh and route by the Knative host.
  resolver 10.43.0.10 valid=30s ipv6=off;
  set $control_plane_upstream control-plane.control-plane.svc.cluster.local;

  location /v1/ {
    proxy_pass http://$control_plane_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host control-plane.control-plane.svc.cluster.local;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE / streaming
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, follow";
  }

  location = /analytics-config.js {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The root is a useful navigational login result. Authenticated SPA routes
  # all serve the same shell and must not become duplicate search results.
  location = / {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "index, follow";
    try_files $uri /index.html;
  }

  # SPA fallback — every non-asset path serves index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, follow";
    try_files $uri $uri/ /index.html;
  }
}
