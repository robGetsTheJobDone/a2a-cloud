<svg xmlns="http://www.w3.org/2000/svg" width="680" height="190" viewBox="0 0 680 190" fill="none">
<title>a2a cloud wordmark</title>
    <rect width="680" height="190" fill="none"/>
    <text x="8" y="118" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
      font-size="112" font-weight="760">a2a</text>
    <text x="236" y="120" fill="#9aa4b2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
